<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#1b2560"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <filter id="glowC" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#22e8ff" flood-opacity="0.9"/>
    </filter>
    <filter id="glowM" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff4fd8" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Android crops maskable icons to whatever shape the launcher uses, so the
       artwork is scaled into the central safe zone while the background still
       bleeds to every edge. -->
  <g transform="translate(256 256) scale(0.78) translate(-256 -256)">
    <g stroke="#2f3768" stroke-width="8" stroke-linecap="round" opacity="0.75">
      <line x1="256" y1="64" x2="256" y2="448"/>
      <line x1="64" y1="256" x2="448" y2="256"/>
    </g>

    <g stroke="#22e8ff" stroke-width="44" stroke-linecap="round" filter="url(#glowC)">
      <line x1="96" y1="96" x2="248" y2="248"/>
      <line x1="248" y1="96" x2="96" y2="248"/>
    </g>

    <circle cx="344" cy="344" r="82" fill="none" stroke="#ff4fd8" stroke-width="44" filter="url(#glowM)"/>
  </g>
</svg>
